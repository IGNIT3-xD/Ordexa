<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrows -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7" />
    </marker>
    
    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Title -->
  <text x="600" y="60" fill="#f8fafc" font-size="32" font-weight="bold" text-anchor="middle" letter-spacing="1">Ordexa Complete Order Workflow</text>
  <text x="600" y="95" fill="#94a3b8" font-size="18" text-anchor="middle">From Seller Onboarding to Automated Customer Delivery</text>

  <!-- ==================== PHASE 1: ONBOARDING ==================== -->
  <g transform="translate(0, 150)">
    <rect x="50" y="0" width="200" height="30" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="150" y="20" fill="#cbd5e1" font-size="14" font-weight="bold" text-anchor="middle">PHASE 1: ONBOARDING</text>

    <!-- Step 1 -->
    <g transform="translate(100, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">1. Seller Signs Up</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Registers &amp; Verifies Email (Code)</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">Creates a Business Workspace</text>
    </g>

    <!-- Arrow -->
    <path d="M 380 90 L 480 90" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

    <!-- Step 2 -->
    <g transform="translate(500, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">2. System Setup</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Auto-creates FREE Subscription</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">Seller adds Products &amp; Inventory</text>
    </g>
  </g>

  <!-- Connection to Phase 2 -->
  <path d="M 640 280 L 640 340" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

  <!-- ==================== PHASE 2: CUSTOMER INTAKE ==================== -->
  <g transform="translate(0, 350)">
    <rect x="50" y="0" width="200" height="30" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="150" y="20" fill="#cbd5e1" font-size="14" font-weight="bold" text-anchor="middle">PHASE 2: CUSTOMER INTAKE</text>

    <!-- Step 3 -->
    <g transform="translate(100, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">3. Generate Form Link</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Seller generates a unique URL</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">Shares it via Facebook Messenger</text>
    </g>

    <!-- Arrow -->
    <path d="M 380 90 L 480 90" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

    <!-- Step 4 -->
    <g transform="translate(500, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">4. Customer Submits</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Fills mobile form (No login)</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">Selects products, sizes &amp; address</text>
    </g>

    <!-- Arrow -->
    <path d="M 780 90 L 880 90" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

    <!-- Step 5 -->
    <g transform="translate(900, 50)">
      <rect width="250" height="80" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#shadow)" stroke-dasharray="5,3"/>
      <text x="125" y="30" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle">5. System Process</text>
      <text x="125" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Saves Submission</text>
      <text x="125" y="70" fill="#64748b" font-size="12" text-anchor="middle">Runs Fraud Check (async)</text>
    </g>
  </g>

  <!-- Connection to Phase 3 -->
  <path d="M 125 480 L 125 540" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

  <!-- ==================== PHASE 3: ORDER MANAGEMENT ==================== -->
  <g transform="translate(0, 550)">
    <rect x="50" y="0" width="200" height="30" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="150" y="20" fill="#cbd5e1" font-size="14" font-weight="bold" text-anchor="middle">PHASE 3: ORDER REVIEW</text>

    <!-- Step 6 -->
    <g transform="translate(100, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">6. Manager Reviews</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Checks Fraud Score &amp; Details</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">Verifies stock &amp; price</text>
    </g>

    <!-- Arrow -->
    <path d="M 380 90 L 480 90" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

    <!-- Step 7 -->
    <g transform="translate(500, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">7. Convert &amp; Confirm</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Converts Submission to Order</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">Confirms order (deducts stock)</text>
    </g>

    <!-- Arrow to Phase 4 -->
    <path d="M 640 180 L 640 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />
  </g>

  <!-- ==================== PHASE 4: FULFILLMENT & NOTIFICATIONS ==================== -->
  <g transform="translate(0, 800)">
    <rect x="50" y="0" width="250" height="30" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="175" y="20" fill="#cbd5e1" font-size="14" font-weight="bold" text-anchor="middle">PHASE 4: NOTIFICATIONS</text>

    <!-- Step 8 -->
    <g transform="translate(100, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#shadow)" stroke-dasharray="5,3"/>
      <text x="140" y="30" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle">8. Invoice &amp; Notification</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">System generates PDF Invoice</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">Queues Messenger Message</text>
    </g>

    <!-- Arrow -->
    <path d="M 380 90 L 480 90" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

    <!-- Step 9 -->
    <g transform="translate(500, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">9. Customer Receives Message</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Gets Order Confirmed text</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">Clicks Invoice &amp; Tracking URL</text>
    </g>

    <!-- Arrow to Phase 5 -->
    <path d="M 220 180 L 220 240" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />
  </g>

  <!-- ==================== PHASE 5: SHIPPING & TRACKING ==================== -->
  <g transform="translate(0, 1050)">
    <rect x="50" y="0" width="250" height="30" rx="6" fill="#1e293b" stroke="#475569" />
    <text x="175" y="20" fill="#cbd5e1" font-size="14" font-weight="bold" text-anchor="middle">PHASE 5: SHIPPING &amp; TRACKING</text>

    <!-- Step 10 -->
    <g transform="translate(100, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
      <text x="140" y="30" fill="#60a5fa" font-size="16" font-weight="bold" text-anchor="middle">10. Book Shipment</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Seller clicks "Book Steadfast"</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">System books parcel via API</text>
    </g>

    <!-- Arrow -->
    <path d="M 380 90 L 480 90" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

    <!-- Step 11 -->
    <g transform="translate(500, 50)">
      <rect width="280" height="80" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#shadow)" stroke-dasharray="5,3"/>
      <text x="140" y="30" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle">11. Webhook Updates</text>
      <text x="140" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Steadfast sends status updates</text>
      <text x="140" y="70" fill="#64748b" font-size="12" text-anchor="middle">System updates timeline</text>
    </g>

    <!-- Arrow -->
    <path d="M 780 90 L 880 90" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-solid)" />

    <!-- Step 12 -->
    <g transform="translate(900, 50)">
      <rect width="250" height="80" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
      <text x="125" y="30" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle">12. Customer Tracks</text>
      <text x="125" y="55" fill="#94a3b8" font-size="13" text-anchor="middle">Opens Tracking Link</text>
      <text x="125" y="70" fill="#64748b" font-size="12" text-anchor="middle">Sees live parcel timeline</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 1250)">
    <text x="0" y="0" fill="#f8fafc" font-size="16" font-weight="bold">Legend:</text>
    
    <rect x="0" y="20" width="20" height="20" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="30" y="35" fill="#94a3b8" font-size="14">Seller Action</text>

    <rect x="150" y="20" width="20" height="20" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="180" y="35" fill="#94a3b8" font-size="14">System / Async Process</text>

    <rect x="350" y="20" width="20" height="20" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="380" y="35" fill="#94a3b8" font-size="14">Customer Action</text>
  </g>
</svg>